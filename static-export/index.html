":7,"name":"Nancy Palacios Mena","rank":"Profesora Asociada","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Nancy Palacios Mena hace parte del grupo de investigación de Políticas Educativas y Vida Escolar. Sus áreas de interés son: La enseñanza y el aprendizaje de las ciencias sociales en primaria y secundaria, el desarrollo de competencias en la educación básica, la relación entre prácticas pedagógicas y aprendizaje, las prácticas pedagógicas etnoeducativas, y la formación de maestros. Actualmente es la directora de Licenciaturas.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":13,"name":"Nataly Obando Rozo","rank":"Profesora Asistente","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Nataly Obando Rozo es economista, Máster en Economía, Máster en Educación y PhD en Psicología Educativa. Se graduó como economista de la Universidad Nacional, obtuvo su primer máster en Economía en la Universidad del Rosario, un segundo máster en Educación en la Universidad de La Rioja, y completó su doctorado, con una beca Fulbright, en Psicología Educativa en la Universidad de Illinois en Chicago.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"En sus inicios como economista estudió temas del mercado y pobreza; en los últimos años ha enfocado su trabajo en educación durante la adolescencia, desarrollo socioemocional y movilidad social.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":3,"name":"Nicolas Juan Camilo Aguilar Forero","rank":"Profesor Asociado","bio":null},{"id":14,"name":"Paula Bibiana Garcia Cardona","rank":"Profesora Asociada","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Áreas de interés: Neurocognición, Neurociencias y Educación, Bilingüismo, Percepción del habla en condiciones acústicas adversas, Electroencefalografía – potenciales relacionados a eventos cognitivos.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":8,"name":"Pedro Gómez","rank":"Profesor Visitante","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Pedro Gómez es licenciado en Matemáticas e Ingeniero Industrial de la Universidad de los Andes; obtuvo un Master of Arts en Economía en The University of Kent at Canterbury, un Master of Science en Lógica y Método Científico en The London School of Economics, y un Diplome d'Etudes Approfondies en Sociología en la Universidad París III. Es doctor en Matemáticas (especialidad Didáctica de la Matemática) de la Universidad de Granada, España.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Fue editor de la revista PNA durante 10 años. Actualmente es profesor de la Universidad de los Andes, director de \"una empresa docente\", director del proyecto Funes y director de la maestría en Educación Matemática. Pedro Gómez es autor de varios libros de texto de matemáticas y de didáctica de la matemática. Su trabajo gira alrededor de la formación de profesores de matemáticas.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}}],"generatedAt":"2026-09-14T19:51:20.674Z"}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normTitle = (t) => (t||'').trim().toUpperCase();
const normP = (s) => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MODLABEL = { PRESENCIAL:'Presencial', VIRTUAL:'Virtual', 'HÍBRIDA':'Hyflex - Híbrida' };

/* ---- requirements (port de src/lib/requirements.ts) ---- */
function matchesTrack(pn, track){
  if(pn==='todos los programas') return true;
  if(pn==='todos los posgrados') return ['profundizacion','investigacion','esp','doc'].includes(track);
  if(pn==='todos los pregrados') return false;
  switch(track){
    case 'profundizacion': if(pn.includes('profundiz')) return true; return pn.includes('maestria') && !pn.includes('investigaci');
    case 'investigacion': if(pn.includes('investigaci')) return true; return pn.includes('maestria') && !pn.includes('profundiz');
    case 'esp': return pn.includes('especializ');
    case 'doc': return pn.includes('doctorado');
    default: return false;
  }
}
function requirementsForTrack(obl, ele, track){
  const set = new Set();
  const add = (arr,label) => { for(const p of (arr||[])){ const n=normP(p); if(!track || matchesTrack(n,track)) set.add(label); } };
  add(obl,'obligatoria'); add(ele,'electiva');
  return ['obligatoria','electiva'].filter(r=>set.has(r));
}
const belongsToTrack = (o,e,t) => requirementsForTrack(o,e,t).length>0;

/* ---- group courses (port de groupCourses.ts) ---- */
function groupCourses(docs){
  const seen = new Map();
  for(const d of docs){
    const key = normTitle(d.title);
    const section = { nrc:d.nrc??null, scheduleSlots:d.scheduleSlots||[], professors:d.professors||[] };
    if(seen.has(key)){ seen.get(key).sections.push(section); }
    else{
      seen.set(key, { ...d, sections:[section] });
    }
  }
  return Array.from(seen.values());
}

/* ---- rich text ---- */
function renderRich(content){
  if(!content || typeof content!=='object') return '';
  const root = content.root; if(!root || !root.children) return '';
  let out='';
  for(const n of root.children){
    if(n.type==='paragraph'){
      if(!n.children || !n.children.length){ out+='<br>'; continue; }
      let inner='';
      for(const c of n.children){
        let t = esc(c.text||'');
        if(c.format & 1) t = '<strong>'+t+'</strong>';
        if(c.format & 2) t = '<em>'+t+'</em>';
        inner += t;
      }
      out += '<p>'+inner+'</p>';
    }
  }
  return '<div class="rich">'+out+'</div>';
}

/* ---- data prep ---- */
const ALL = groupCourses(DATA.courses);
const PREGRADO = ALL.filter(c=>c.category==='pregrado');
const POSGRADO_ALL = ALL.filter(c=>c.category==='posgrado');

function inMaestria(c, trackKey, subVals){
  if(c.subProgram) return subVals.includes(c.subProgram);
  const hasReqs = ((c.obligatoriaEn||[]).length + (c.electivaEn||[]).length) > 0;
  if(hasReqs) return belongsToTrack(c.obligatoriaEn, c.electivaEn, trackKey);
  return true;
}
function posgradoSections(){
  const allMS = ALL.filter(c=>c.programType==='MS');
  const msProf = allMS.filter(c=>inMaestria(c,'profundizacion',['profundizacion','compartido']));
  const msInv = allMS.filter(c=>inMaestria(c,'investigacion',['investigacion','compartido']));
  const esp = ALL.filter(c=>c.programType==='ESP' || belongsToTrack(c.obligatoriaEn,c.electivaEn,'esp'));
  const doc = ALL.filter(c=>c.programType==='DOC' || belongsToTrack(c.obligatoriaEn,c.electivaEn,'doc'));
  const s=[];
  if(msProf.length) s.push({key:'profundizacion',label:'Maestría',sublabel:'Profundización',courses:msProf,dark:false});
  if(msInv.length) s.push({key:'investigacion',label:'Maestría',sublabel:'Investigación',courses:msInv,dark:true});
  if(!msProf.length && !msInv.length && allMS.length) s.push({key:'ms',label:'Maestría',courses:allMS,dark:false});
  if(esp.length) s.push({key:'esp',label:'Especialización',courses:esp,dark:false});
  if(doc.length) s.push({key:'doc',label:'Doctorado',courses:doc,dark:true});
  return s;
}
// Professors with their courses
function coursesForProf(pid){
  const map = new Map();
  for(const d of DATA.courses){
    if(!(d.professors||[]).some(p=>String(p.id)===String(pid))) continue;
    const k = normTitle(d.title);
    if(!map.has(k)) map.set(k,{ id:d.id, title:d.title, code:d.code??null, category:d.category, programType:d.programType });
  }
  return Array.from(map.values());
}

/* ---- state ---- */
const state = { view:'home', posTab:0, search:'', modality:'all', requirement:'all' };

/* ---- rendering ---- */
const app = document.getElementById('app');
function render(){
  if(state.view==='home') return renderHome();
  if(state.view==='pregrado') return renderList('pregrado');
  if(state.view==='posgrado') return renderPosgrado();
  if(state.view==='profes') return renderProfes();
}

function header(active){
  return '<header class="bar"><div class="row">'
    + '<button class="brand" onclick="go(\'home\')"><span class="b1 display">Cursos</span><span class="b2 display">Facultad de Educación</span></button>'
    + '<div class="tabs">'
    + tabBtn('pregrado','Pregrado',active) + tabBtn('posgrado','Posgrado',active) + tabBtn('profes','Profes',active)
    + '</div></div></header>';
}
const tabBtn = (v,l,active) => '<button class="tab'+(active===v?' active':'')+'" onclick="go(\''+v+'\')">'+l+'</button>';

function renderHome(){
  app.innerHTML = '<div class="home">'
    + '<div class="blob" style="top:-128px;right:-128px;width:384px;height:384px"></div>'
    + '<div class="blob" style="bottom:-160px;left:-160px;width:448px;height:448px"></div>'
    + '<div class="inner">'
    + '<div><h1 class="display">Cursos</h1><p class="sub display">Facultad de Educación</p><div class="rule"></div></div>'
    + '<div class="navgrid">'
    + '<div class="navgrid two">'
    + navBtn('pregrado','PREGRADO','') + navBtn('posgrado','POSGRADO','')
    + '</div>'
    + navBtn('profes','PROFES','small')
    + '</div>'
    + '<footer class="foot">Universidad de los Andes · Facultad de Educación · Oferta 2026-2</footer>'
    + '</div></div>';
}
const navBtn = (v,l,cls) => '<button class="navbtn '+cls+'" onclick="go(\''+v+'\')"><span class="fill"></span><span class="t">'+l+'</span></button>';

function courseCard(c, track){
  const isPos = ['MS','ESP','DOC'].includes(c.programType);
  const reqs = isPos ? requirementsForTrack(c.obligatoriaEn,c.electivaEn,track) : [];
  const cat = c.category==='pregrado' ? 'PREGRADO' : 'POSGRADO';
  let reqHtml='';
  if(reqs.length){ reqHtml='<div class="reqs">'+reqs.map(r=>'<span class="badge '+(r==='obligatoria'?'oblig':'elect')+'">'+(r==='obligatoria'?'OBLIGATORIA':'ELECTIVA')+'</span>').join('')+'</div>'; }
  const notoffer = !c.active ? '<div class="reqs" style="left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center"><div style="border:1px solid rgba(255,255,255,.7);padding:8px 16px;text-align:center;color:#fff;font-weight:700;letter-spacing:.1em;font-size:.85rem">NO SE OFERTA<br>EN 2026-2</div></div>' : '';
  const secBadge = c.sections.length>1 ? '<span class="badge sec">'+c.sections.length+' secc.</span>' : '';
  const imgId = 'course-'+c.id;
  return '<button class="card" onclick="openCourse('+c.id+',\''+(track||'')+'\')">'
    + '<div class="head"><h3 class="display">'+esc(c.title)+(c.titleLine2?'<br>'+esc(c.titleLine2):'')+'</h3></div>'
    + '<div class="imgarea">'
    + '<img src="media/'+imgId+'.jpg" alt="" onerror="this.style.display=\'none\'">'
    + '<span class="noimg">Sin imagen</span>'
    + reqHtml + notoffer
    + '<div class="foot">'+secBadge+'<span class="badge cat">'+cat+'</span></div>'
    + '</div></button>';
}

function filterBar(courses, track){
  const mods = [...new Set(courses.map(c=>c.modality).filter(Boolean))];
  const reqSet = new Set();
  for(const c of courses){ for(const r of requirementsForTrack(c.obligatoriaEn,c.electivaEn,track)) reqSet.add(r); }
  const reqs = ['obligatoria','electiva'].filter(r=>reqSet.has(r));
  let h='<div class="filters">';
  if(mods.length){
    h+='<div class="frow"><span class="flabel">Modalidad</span>';
    h+=chip('Todas', state.modality==='all', "setMod('all')");
    for(const m of mods) h+=chip(MODLABEL[m]||m, state.modality===m, "setMod('"+m+"')");
    h+='</div>';
  }
  if(reqs.length){
    h+='<div class="frow"><span class="flabel">Tipo</span>';
    h+=chip('Todos', state.requirement==='all', "setReq('all')");
    for(const r of reqs) h+=chip(r==='obligatoria'?'Obligatoria':'Electiva', state.requirement===r, "setReq('"+r+"')");
    h+='</div>';
  }
  h+='</div>';
  return h;
}
const chip = (l,on,fn) => '<button class="chip'+(on?' on':'')+'" onclick="'+fn+'">'+l+'</button>';

function applyFilters(courses, track){
  const q = normP(state.search);
  return courses.filter(c=>{
    if(q && !normP(c.title).includes(q)) return false;
    if(state.modality!=='all' && c.modality!==state.modality) return false;
    if(state.requirement!=='all'){
      const rs = requirementsForTrack(c.obligatoriaEn,c.electivaEn,track);
      if(!rs.includes(state.requirement)) return false;
    }
    return true;
  });
}

function searchBox(){
  return '<div class="search"><span class="ic">⌕</span>'
    + '<input type="search" placeholder="Buscar curso por nombre…" value="'+esc(state.search)+'" oninput="onSearch(this.value)"></div>';
}

function renderList(cat){
  const base = cat==='pregrado' ? PREGRADO : POSGRADO_ALL;
  const list = applyFilters(base, undefined);
  app.innerHTML = header(cat) + '<div class="wrap">'
    + '<div class="sechead"><h2 class="display">'+(cat==='pregrado'?'Pregrado':'Posgrado')+'</h2>'
    + '<p>'+base.length+' cursos · 2026-2</p></div>'
    + searchBox()
    + filterBar(base, undefined)
    + gridHtml(list, undefined)
    + footerHtml()
    + '</div>';
  restoreSearchFocus();
}

function renderPosgrado(){
  const sections = posgradoSections();
  if(state.posTab>=sections.length) state.posTab=0;
  const cur = sections[state.posTab];
  let pt='<div class="ptabs">';
  sections.forEach((s,i)=>{
    const on = i===state.posTab ? (s.dark?'on-dark':'on-green') : '';
    pt += '<button class="ptab '+on+'" onclick="setPosTab('+i+')">'+s.label+(s.sublabel?'<span class="sl">'+s.sublabel+'</span>':'')+' ('+s.courses.length+')</button>';
  });
  pt+='</div>';
  const list = applyFilters(cur.courses, cur.key);
  app.innerHTML = header('posgrado') + '<div class="wrap">'
    + '<div class="sechead"><h2 class="display">Posgrado</h2><p>'+POSGRADO_ALL.length+' cursos · 2026-2</p></div>'
    + pt
    + '<div class="psechead"><div class="barv" style="background:'+(cur.dark?'#000':'var(--green)')+'"></div>'
    + '<div><h2 class="display" style="font-size:1.5rem;margin:0">'+cur.label+'</h2>'
    + (cur.sublabel?'<p style="margin:.2rem 0 0;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:#9a9a9a">'+cur.sublabel+'</p>':'')
    + '<p style="margin:.1rem 0 0;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:#9a9a9a">'+cur.courses.length+' cursos · 2026-2</p></div></div>'
    + searchBox()
    + filterBar(cur.courses, cur.key)
    + gridHtml(list, cur.key)
    + footerHtml()
    + '</div>';
  restoreSearchFocus();
}

function gridHtml(list, track){
  if(!list.length) return '<p class="empty">No hay cursos que coincidan.</p>';
  return '<div class="grid">'+list.map(c=>courseCard(c,track)).join('')+'</div>';
}

function renderProfes(){
  const profs = DATA.professors.map(p=>({ ...p, courses:coursesForProf(p.id) }));
  const cards = profs.map(p=>{
    const ini = p.name.split(' ').slice(0,2).map(w=>w[0]||'').join('');
    return '<button class="pcard" onclick="openProf('+p.id+')">'
      + '<div class="ph"><img src="media/prof-'+p.id+'.jpg" alt="" onerror="this.style.display=\'none\'"><span class="ini display">'+esc(ini)+'</span></div>'
      + '<div><p class="pn display">'+esc(p.name)+'</p>'
      + (p.rank?'<p class="pr">'+esc(p.rank)+'</p>':'')
      + (p.courses.length?'<p class="pc">'+p.courses.length+(p.courses.length===1?' curso':' cursos')+'</p>':'')
      + '</div></button>';
  }).join('');
  app.innerHTML = header('profes') + '<div class="wrap">'
    + '<div class="sechead"><h2 class="display">Profes de la Facu</h2><p>'+profs.length+' profesores</p></div>'
    + '<div class="pgrid">'+cards+'</div>'
    + footerHtml()
    + '</div>';
}

function footerHtml(){
  return '<footer class="foot">Universidad de los Andes · Facultad de Educación · Oferta 2026-2<br>'
    + 'Versión estática generada el '+new Date(DATA.generatedAt).toLocaleDateString('es-CO')+'</footer>';
}

/* ---- drawers ---- */
function closeDrawer(){ const b=document.getElementById('drawer-root'); if(b) b.remove(); document.body.style.overflow=''; }
function mountDrawer(html){
  closeDrawer();
  const div=document.createElement('div'); div.id='drawer-root';
  div.innerHTML='<div class="backdrop" onclick="closeDrawer()"></div><div class="drawer" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(div); document.body.style.overflow='hidden';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function findGroupedById(id){ return ALL.find(c=>c.sections && (c.id===id)) || ALL.find(c=> normTitle(c.title)===normTitle((DATA.courses.find(d=>d.id===id)||{}).title||'')); }

function openCourse(id, track){
  const c = ALL.find(x=>x.id===id) || findGroupedById(id);
  if(!c) return;
  const metaPrim=[c.code, c.weeks?c.weeks+' SEMANAS':null, c.credits?c.credits+' CRD':null].filter(Boolean);
  const metaSec=[c.modality?(MODLABEL[c.modality]||c.modality):null].filter(Boolean);
  let secHtml='';
  if(c.sections && c.sections.length){
    secHtml='<div class="secbar">'+c.sections.map((s,i)=>{
      let h='<div class="sblock">';
      const hdr=[];
      if(c.sections.length>1) hdr.push('<span class="badge sec">SECCIÓN '+(i+1)+'</span>');
      if(s.nrc) hdr.push('<span style="font-size:.72rem;color:#737373">NRC '+esc(s.nrc)+'</span>');
      if(hdr.length) h+='<div style="display:flex;align-items:center;gap:12px">'+hdr.join('')+'</div>';
      if(s.scheduleSlots && s.scheduleSlots.length){
        h+='<div class="slotwrap">'+s.scheduleSlots.map(sl=>'<div class="slot"><div class="d display">'+esc(sl.day)+'</div><div class="h">'+esc(sl.startTime)+' – '+esc(sl.endTime)+'</div></div>').join('')+'</div>';
      }
      if(s.professors && s.professors.length){
        h+='<div style="display:flex;flex-wrap:wrap;gap:4px 12px">'+s.professors.map(p=>'<button class="proflink" onclick="openProf('+p.id+')">'+esc(p.name)+(p.rank?' · '+esc(p.rank):'')+'</button>').join('')+'</div>';
      }
      h+='</div>'; return h;
    }).join('')+'</div>';
  }
  let reqTags='';
  if((c.obligatoriaEn||[]).length || (c.electivaEn||[]).length){
    reqTags='<div class="chiprow">'
      + (c.obligatoriaEn||[]).map(p=>'<span class="tag oblig">Obligatoria · '+esc(p)+'</span>').join('')
      + (c.electivaEn||[]).map(p=>'<span class="tag elect">Electiva · '+esc(p)+'</span>').join('')
      + '</div>';
  }
  let info='';
  if(c.prerequisites||c.corequisites||c.observations){
    info='<div class="info">'
      + (c.prerequisites?'<div><div class="l">Prerrequisitos</div><div class="v">'+esc(c.prerequisites)+'</div></div>':'')
      + (c.corequisites?'<div><div class="l">Correquisitos</div><div class="v">'+esc(c.corequisites)+'</div></div>':'')
      + (c.observations?'<div><div class="l">Observaciones</div><div class="v">'+esc(c.observations)+'</div></div>':'')
      + '</div>';
  }
  const html = '<div class="top"><button class="closeb k" onclick="closeDrawer()">←</button>'
    + '<span class="badge cat" style="padding:6px 16px">'+esc(c.programType)+'</span></div>'
    + '<div class="pdphoto"><img src="media/course-'+c.id+'.jpg" alt="" onerror="this.parentElement.style.display=\'none\'"></div>'
    + '<div class="dpad">'
    + '<h2 class="dtitle display">'+esc(c.title)+(c.titleLine2?'<br>'+esc(c.titleLine2):'')+'</h2>'
    + ((metaPrim.length||metaSec.length)?'<div class="dmeta">'+(metaPrim.length?'<div>'+metaPrim.map(esc).join('  |  ')+'</div>':'')+(metaSec.length?'<div>'+metaSec.map(esc).join('  |  ')+'</div>':'')+'</div>':'')
    + secHtml
    + (!c.active?'<div class="notoffer">NO SE OFERTA EN 2026-2</div>':'')
    + (c.description?'<div style="margin-top:24px">'+renderRich(c.description)+'</div>':'')
    + reqTags
    + info
    + '</div>';
  mountDrawer(html);
}

function openProf(id){
  const p = DATA.professors.find(x=>String(x.id)===String(id));
  if(!p) return;
  const courses = coursesForProf(id);
  const ini = p.name.split(' ').slice(0,2).map(w=>w[0]||'').join('');
  const preg = courses.filter(c=>c.category==='pregrado');
  const posg = courses.filter(c=>c.category==='posgrado');
  const courseItem = (c,dark)=> '<button class="courselink" onclick="openCourseByTitle(\''+c.category+'\','+jsq(c.title)+')">'
    + '<span class="pt '+(dark?'k':'g')+'">'+esc(c.programType)+'</span>'
    + '<span class="ct display">'+esc(c.title)+'</span>'
    + (c.code?'<span class="cc">'+esc(c.code)+'</span>':'')
    + '</button>';
  let coursesHtml='';
  if(courses.length){
    coursesHtml='<div style="margin-top:32px"><p class="grouplabel">Cursos que dicta</p>';
    if(preg.length) coursesHtml+='<div style="margin-bottom:16px"><p class="grouplabel">Pregrado</p><div style="display:flex;flex-direction:column;gap:8px">'+preg.map(c=>courseItem(c,false)).join('')+'</div></div>';
    if(posg.length) coursesHtml+='<div><p class="grouplabel">Posgrado</p><div style="display:flex;flex-direction:column;gap:8px">'+posg.map(c=>courseItem(c,true)).join('')+'</div></div>';
    coursesHtml+='</div>';
  }
  const html='<div class="top"><button class="closeb g" onclick="closeDrawer()">←</button>'
    + (p.rank?'<span class="rankpill">'+esc(p.rank)+'</span>':'')+'</div>'
    + '<div class="pdphoto"><img src="media/prof-'+p.id+'.jpg" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
    + '<div class="fallback" style="display:none"><span>'+esc(ini)+'</span></div></div>'
    + '<div class="dpad">'
    + '<h2 class="dtitle display">'+esc(p.name)+'</h2>'
    + (p.bio?'<div style="margin-top:20px;border-top:1px solid #f0f0f0;padding-top:20px">'+renderRich(p.bio)+'</div>':'')
    + coursesHtml
    + '</div>';
  mountDrawer(html);
}

function jsq(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function openCourseByTitle(cat, title){
  const c = ALL.find(x=>x.category===cat && normTitle(x.title)===normTitle(title)) || ALL.find(x=>normTitle(x.title)===normTitle(title));
  if(c){ const track = cat==='posgrado' ? undefined : undefined; openCourse(c.id, undefined); }
}

/* ---- actions ---- */
function go(v){ state.view=v; state.search=''; state.modality='all'; state.requirement='all'; state.posTab=0; closeDrawer(); window.scrollTo(0,0); render(); }
let searchFocus=false;
function onSearch(v){ state.search=v; searchFocus=true; if(state.view==='posgrado') renderPosgrado(); else render(); }
function setMod(m){ state.modality=m; searchFocus=false; if(state.view==='posgrado') renderPosgrado(); else render(); }
function setReq(r){ state.requirement=r; searchFocus=false; if(state.view==='posgrado') renderPosgrado(); else render(); }
function setPosTab(i){ state.posTab=i; state.requirement='all'; renderPosgrado(); }
function restoreSearchFocus(){ if(searchFocus){ const el=app.querySelector('input[type=search]'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } searchFocus=false; } }

render();
</script>
</body>
</html>
