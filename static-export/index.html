<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos — Facultad de Educación (Uniandes)</title>
<meta name="description" content="Oferta de cursos de pregrado y posgrado de la Facultad de Educación · Universidad de los Andes · 2026-2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Solway:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --green:#06a94d; --green-d:#058a3f; --ink:#000; }
  *{ box-sizing:border-box; }
  html{ -webkit-font-smoothing:antialiased; }
  body{ margin:0; background:#fff; color:#000; font-family:'Raleway',system-ui,-apple-system,sans-serif; }
  .display{ font-family:'Solway',Georgia,serif; }
  .mono{ font-family:'Raleway',system-ui,sans-serif; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  .wrap{ max-width:1152px; margin:0 auto; padding:0 24px; }
  .hidden{ display:none !important; }

  /* Home */
  .home{ position:relative; min-height:100vh; overflow:hidden; }
  .home .blob{ position:absolute; border-radius:9999px; background:rgba(6,169,77,.10); filter:blur(60px); pointer-events:none; }
  .home .inner{ position:relative; max-width:960px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:64px 24px; }
  .home h1{ font-size:clamp(3.5rem,10vw,6rem); font-weight:800; line-height:.9; letter-spacing:-.02em; margin:0; }
  .home .sub{ margin:.4rem 0 0; font-size:clamp(1.4rem,4vw,1.9rem); font-weight:500; color:#404040; }
  .home .rule{ margin-top:1rem; height:6px; width:96px; border-radius:9999px; background:var(--green); }
  .navgrid{ margin-top:3rem; display:grid; gap:16px; }
  @media(min-width:640px){ .navgrid.two{ grid-template-columns:1fr 1fr; } }
  .navbtn{ position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; border:none; border-radius:16px; background:#000; color:#fff; padding:40px 24px; text-align:center; transition:transform .2s; }
  .navbtn.small{ padding:28px 24px; }
  .navbtn:hover{ transform:translateY(-4px); }
  .navbtn .fill{ position:absolute; inset:0; background:var(--green); transform:translateY(100%); transition:transform .3s; }
  .navbtn:hover .fill{ transform:translateY(0); }
  .navbtn span.t{ position:relative; font-family:'Solway',serif; font-weight:800; letter-spacing:.15em; font-size:1.9rem; }
  .navbtn.small span.t{ font-size:1.5rem; }

  /* Header (interior) */
  header.bar{ position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid #eee; }
  .bar .row{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; max-width:1152px; margin:0 auto; }
  .brand{ display:flex; align-items:baseline; gap:12px; border:none; background:none; padding:0; }
  .brand .b1{ font-family:'Solway',serif; font-weight:800; font-size:1.9rem; line-height:1; }
  .brand .b2{ font-family:'Solway',serif; color:#555; font-size:1rem; }
  .tabs{ display:flex; gap:8px; }
  .tab{ border:none; border-radius:9999px; padding:8px 18px; font-family:'Solway',serif; font-weight:800; letter-spacing:.12em; font-size:.8rem; background:#f2f2f2; color:#333; }
  .tab.active{ background:#000; color:#fff; }

  /* Section head */
  .sechead{ margin:40px 0 24px; }
  .sechead h2{ font-family:'Solway',serif; font-weight:800; font-size:1.6rem; margin:0; letter-spacing:-.01em; }
  .sechead p{ margin:.2rem 0 0; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:#9a9a9a; }

  /* Search */
  .search{ position:relative; margin:0 0 24px; }
  .search input{ width:100%; border:1px solid #d4d4d4; border-radius:9999px; padding:12px 18px 12px 40px; font-size:1rem; font-family:'Solway',serif; }
  .search input:focus{ outline:none; border-color:#000; }
  .search .ic{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#9a9a9a; }

  /* Filters */
  .filters{ margin-bottom:28px; display:flex; flex-direction:column; gap:12px; }
  .frow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .flabel{ margin-right:4px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#9a9a9a; }
  .chip{ flex-shrink:0; border:1px solid #d4d4d4; background:#fff; color:#404040; border-radius:9999px; padding:6px 16px; font-family:'Solway',serif; font-weight:700; font-size:.85rem; }
  .chip:hover{ border-color:#000; color:#000; }
  .chip.on{ border-color:var(--green); background:var(--green); color:#000; }
  .clear{ align-self:flex-start; border:none; background:none; font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:#a3a3a3; text-decoration:underline; text-underline-offset:4px; }

  /* Posgrado tab pills */
  .ptabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:32px; padding-bottom:4px; }
  .ptab{ flex-shrink:0; border:none; border-radius:9999px; padding:8px 16px; font-family:'Solway',serif; font-weight:800; letter-spacing:.1em; font-size:.85rem; background:#f2f2f2; color:#555; }
  .ptab.on-green{ background:var(--green); color:#000; }
  .ptab.on-dark{ background:#000; color:#fff; }
  .ptab .sl{ margin-left:6px; font-family:'Raleway'; font-size:10px; font-weight:400; text-transform:none; letter-spacing:0; opacity:.7; }
  .psechead{ display:flex; align-items:flex-end; gap:16px; margin-bottom:24px; }
  .psechead .barv{ width:6px; height:32px; border-radius:9999px; }

  /* Grid + cards */
  .grid{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media(min-width:640px){ .grid{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ .grid{ grid-template-columns:1fr 1fr 1fr; } }
  .card{ display:flex; flex-direction:column; overflow:hidden; border-radius:16px; background:#fff; text-align:left; border:1px solid rgba(0,0,0,.06); box-shadow:0 2px 12px rgba(0,0,0,.06); transition:transform .2s, box-shadow .2s; padding:0; }
  .card:hover{ transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,.14); }
  .card .head{ min-height:76px; display:flex; align-items:flex-start; background:var(--green); padding:16px 20px; }
  .card .head h3{ margin:0; font-family:'Solway',serif; font-weight:800; text-transform:uppercase; font-size:1rem; line-height:1.15; letter-spacing:.02em; color:#000; }
  .card .imgarea{ position:relative; min-height:200px; flex:1; overflow:hidden; background:#e5e5e5; display:flex; align-items:center; justify-content:center; }
  .card .imgarea img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .card .noimg{ font-size:.72rem; color:#a3a3a3; }
  .card .reqs{ position:absolute; left:12px; top:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .badge{ border-radius:9999px; padding:4px 10px; font-family:'Solway',serif; font-weight:700; font-size:11px; letter-spacing:.06em; }
  .badge.oblig{ background:#000; color:#fff; }
  .badge.elect{ background:#fff; color:#333; border:1px solid #d4d4d4; }
  .card .foot{ position:absolute; bottom:12px; right:12px; display:flex; gap:6px; }
  .badge.sec{ background:var(--green); color:#000; }
  .badge.cat{ background:#000; color:#fff; }

  /* Professors grid */
  .pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:24px 24px; }
  @media(min-width:640px){ .pgrid{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:1024px){ .pgrid{ grid-template-columns:repeat(4,1fr); } }
  .pcard{ border:none; background:none; text-align:left; display:flex; flex-direction:column; gap:12px; padding:0; }
  .pcard .ph{ position:relative; aspect-ratio:1; border-radius:16px; overflow:hidden; background:rgba(0,0,0,.08); box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); display:flex; align-items:center; justify-content:center; transition:transform .2s, box-shadow .2s; }
  .pcard:hover .ph{ transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.18); }
  .pcard .ph img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top; }
  .pcard .ini{ font-family:'Solway',serif; font-weight:800; font-size:2.2rem; color:rgba(0,0,0,.2); }
  .pcard .pn{ font-family:'Solway',serif; font-weight:800; text-transform:uppercase; font-size:.85rem; line-height:1.15; letter-spacing:.03em; }
  .pcard .pr{ margin-top:2px; font-size:.85rem; color:rgba(0,0,0,.7); }
  .pcard .pc{ margin-top:4px; font-size:.75rem; color:rgba(0,0,0,.5); }

  /* Drawer */
  .backdrop{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5); backdrop-filter:blur(2px); animation:fade .25s ease; }
  .drawer{ position:fixed; right:0; top:0; z-index:50; height:100%; width:100%; max-width:576px; background:#fff; box-shadow:-10px 0 40px rgba(0,0,0,.25); overflow-y:auto; animation:slidein .3s cubic-bezier(.16,1,.3,1); }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  @keyframes slidein{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  .drawer .top{ position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:rgba(255,255,255,.85); backdrop-filter:blur(8px); }
  .closeb{ width:40px; height:40px; border:none; border-radius:9999px; font-size:1.1rem; display:flex; align-items:center; justify-content:center; }
  .closeb.g{ background:var(--green); color:#000; }
  .closeb.k{ background:#000; color:#fff; }
  .dpad{ padding:24px; }
  .dtitle{ font-family:'Solway',serif; font-weight:800; text-transform:uppercase; font-size:1.7rem; line-height:1.15; letter-spacing:.02em; margin:0; }
  .dmeta{ margin-top:12px; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; color:#8a8a8a; line-height:1.6; }
  .rich p{ font-size:.9rem; line-height:1.65; color:#404040; margin:0 0 12px; }
  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
  .tag{ border-radius:9999px; padding:4px 12px; font-size:.72rem; }
  .tag.oblig{ background:#000; color:#fff; }
  .tag.elect{ background:#f4f4f4; color:#404040; border:1px solid #d4d4d4; }
  .sblock{ display:flex; flex-direction:column; gap:8px; }
  .secbar{ border-top:1px solid #f0f0f0; border-bottom:1px solid #f0f0f0; padding:20px 0; margin-top:20px; display:flex; flex-direction:column; gap:16px; }
  .slotwrap{ display:flex; flex-wrap:wrap; gap:8px 24px; }
  .slot .d{ font-family:'Solway',serif; font-weight:800; text-transform:uppercase; font-size:.72rem; letter-spacing:.12em; color:var(--green); }
  .slot .h{ font-size:.9rem; }
  .proflink{ display:inline-block; font-size:.78rem; color:#525252; text-decoration:underline; text-decoration-color:var(--green); text-decoration-thickness:2px; text-underline-offset:2px; background:none; border:none; padding:0; }
  .proflink:hover{ color:#000; }
  .info{ margin-top:24px; border-top:1px solid #f0f0f0; padding-top:20px; display:flex; flex-direction:column; gap:12px; }
  .info .l{ font-family:'Solway',serif; font-weight:800; text-transform:uppercase; font-size:.72rem; letter-spacing:.12em; color:#9a9a9a; }
  .info .v{ margin-top:2px; font-size:.9rem; line-height:1.6; color:#404040; }
  .notoffer{ margin-top:20px; border:2px solid #000; padding:12px; text-align:center; font-size:.85rem; font-weight:700; letter-spacing:.1em; }
  .rankpill{ border-radius:9999px; background:var(--green); padding:6px 16px; font-family:'Solway',serif; font-weight:800; letter-spacing:.06em; font-size:.85rem; }

  /* Professor drawer photo */
  .pdphoto{ position:relative; aspect-ratio:4/3; width:100%; background:#e5e5e5; overflow:hidden; }
  .pdphoto img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top; }
  .pdphoto .fallback{ height:100%; display:flex; align-items:center; justify-content:center; background:var(--green); }
  .pdphoto .fallback span{ font-family:'Solway',serif; font-weight:800; font-size:4.5rem; color:rgba(0,0,0,.2); }
  .courselink{ display:flex; align-items:flex-start; gap:12px; border-radius:12px; background:#fafafa; padding:12px 16px; border:none; text-align:left; width:100%; }
  .courselink:hover{ background:#f0f0f0; }
  .courselink .pt{ margin-top:2px; flex-shrink:0; border-radius:9999px; padding:2px 8px; font-family:'Solway',serif; font-weight:800; font-size:10px; letter-spacing:.12em; }
  .courselink .pt.g{ background:var(--green); color:#000; }
  .courselink .pt.k{ background:#000; color:#fff; }
  .courselink .ct{ font-family:'Solway',serif; font-weight:700; font-size:.85rem; line-height:1.2; }
  .courselink .cc{ margin-left:auto; font-size:.72rem; color:#a3a3a3; flex-shrink:0; }
  .grouplabel{ margin:0 0 8px; font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; color:#9a9a9a; }
  .empty{ font-size:.85rem; color:#737373; padding:12px 0; }
  footer.foot{ padding:40px 24px 56px; text-align:center; color:#9a9a9a; font-size:.72rem; }
  footer.foot a{ color:var(--green); }
</style>
</head>

,"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"9:30 AM","endTime":"10:50 AM"},{"day":"JUEVES","startTime":"9:30 AM","endTime":"10:50 AM"}],"professors":[{"id":16,"name":"Hans Walter Cabra Hernandez","rank":"Profesor Asistente"}]},{"id":84,"title":"TEORÍAS Y RETOS DEL APRENDIZAJE","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-1100","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"El aprendizaje es uno de los procesos psicológicos más intrigantes. Por una parte, es central a la adaptación de los organismos al ambiente y por esta razón pasa desapercibido. Por otro lado, requiere condiciones muy precisas para su ocurrencia y es relativamente raro en ciertas condiciones. Además, es el producto de complejos procesos biológicos, cognitivos y socioculturales. Pero, sobre todo, el aprendizaje es, en últimas, una condición necesaria para el logro de los objetivos educativos y para la recreación permanente de la cultura.","version":1}]},{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Dicho de manera simple, sin aprendizaje no hay educación. ¿Qué es el aprendizaje? ¿Cómo ocurre? ¿Cómo podemos promover el aprendizaje y saber que alguien ha aprendido?","version":1}]},{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"En este curso estudiaremos las principales teorías que han intentado responder estas preguntas: las teorías conductistas, las teorías cognitivas y la teoría sociocultural. Este recorrido nos llevará a comprender que no hay una única respuesta para esas preguntas y que, por el contrario, el aprendizaje ha sido definido y explicado de diferentes maneras.","version":1}]},{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Este curso parte de la idea de que todas esas teorías tienen fortalezas que deben ser valoradas cuando se trata de entender los problemas que supone la educación. Adicionalmente, al estudiar esas teorías veremos que, aunque solo algunas de ellas hicieron planteamientos explícitos para la educación, todas tienen implicaciones importantes para la práctica pedagógica.","version":1}]},{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"A lo largo del curso prestaremos especial atención a esas implicaciones para que, al final del semestre, cada uno de los estudiantes comprenda el lugar que esas teorías puede tener en la práctica pedagógica.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"VIERNES","startTime":"8:00 AM","endTime":"9:50 AM"},{"day":"MIÉRCOLES","startTime":"8:00 AM","endTime":"9:50 AM"}],"professors":[{"id":15,"name":"Ana Maria Velasquez Niño","rank":"Profesora Titular"}]},{"id":83,"title":"DIVERSIDAD Y EDUCACIÓN","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-1103","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Una educación de calidad valora la diversidad y genera equidad de oportunidades para que todos los integrantes de la comunidad educativa participen y aporten a los procesos de enseñanza-aprendizaje que les unen. Sin embargo, históricamente, la educación ha tendido a homogeneizar a los estudiantes y promover epistemologías hegemónicas, por lo tanto se han generado procesos de exclusión. Este contexto convoca a los educadores a pensarse ¿cómo transformar la educación para lograr procesos incluyentes, que reconozcan y acojan la diversidad humana? En este curso analizaremos las distintas formas en que marcadores de identidad interactúan con las prácticas culturales de exclusión en la educación y las posibilidades de una educación inclusiva.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"JUEVES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":14,"name":"Paula Bibiana Garcia Cardona","rank":"Profesora Asociada"}]},{"id":82,"title":"SEMILLERO DE INVESTIGACION","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2000","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Este curso busca brindar a los/as estudiantes la oportunidad de participar de primera mano en actividades investigativas del grupo de investigación en educación para la primera infancia. Esto implica aproximarse de manera crítica a diferentes herramientas, metodologías y temáticas, así como hacer parte activa de distintas fases del proceso investigativo.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[]},{"id":81,"title":"MINDSET LAB","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2002","credits":1,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[{"id":14,"name":"Paula Bibiana Garcia Cardona","rank":"Profesora Asociada"}]},{"id":80,"title":"SEMILLERO DE INVESTIGACIÓN","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2004","credits":2,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Este curso busca brindar a los/as estudiantes la oportunidad de participar de primera mano en actividades investigativas del grupo de investigación en educación para la primera infancia. Esto implica aproximarse de manera crítica a diferentes herramientas, metodologías y temáticas, así como hacer parte activa de distintas fases del proceso investigativo.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[]},{"id":79,"title":"INVESTIGACIÓN EN EDUCACIÓN","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2007","credits":2,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"VIERNES","startTime":"11:00 AM","endTime":"12:50 PM"}],"professors":[{"id":13,"name":"Nataly Obando Rozo","rank":"Profesora Asistente"}]},{"id":78,"title":"INVESTIGACIÓN ACCIÓN EN EL AULA","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2011","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"El curso Investigación Acción busca que el estudiante: comprenda las fases y procesos inherentes al ciclo de la investigación acción y aplique estos conocimientos a la reflexión continua que permita la transformación, rediseño y permanente evaluación de su práctica como profesional de la educación; caracterice, reflexione, diseñe e intervenga su entorno educativo con el fin de transformarlo de manera crítica y participativa; y reflexione de manera sistemática sobre su práctica educativa mediante el uso de diferentes técnicas de recolección y análisis para resolver problemas transformándolos.","version":1}]}]}},"prerequisites":"INVESTIGACIÓN EN EDUCACIÓN Y PRÁCTICA FORMATIVA 1.","corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"LUNES","startTime":"5:00 PM","endTime":"7:50 PM"}],"professors":[{"id":12,"name":"Jose Dario Herrera Gonzalez","rank":"Profesor Asociado"}]},{"id":77,"title":"CALIDAD DE LAS INTERACCIONES EN LA PRIMERA INFANCIA","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2018","credits":3,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":null,"corequisites":null,"observations":"Solo para estudiantes que cursan Licenciatura en Educación Infantil como primer o segundo programa.","active":true,"obligatoriaEn":["Todos los pregrados"],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"5:00 PM","endTime":"7:50 PM"}],"professors":[{"id":11,"name":"Carolina Maldonado Carreño","rank":"Profesora Titular"}]},{"id":76,"title":"EVALUACION DEL APRENDIZAJE","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2103","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"En este curso se espera que los estudiantes se apropien de los principales conceptos y enfoques de la evaluación en el contexto del aprendizaje, adquieran habilidades para el diseño y validación de instrumentos, así como de la interpretación de resultados de evaluación. De igual forma, se espera que reconozcan los efectos que tiene la evaluación sobre las personas, así como los valores e intereses que subyacen al ejercicio de la evaluación. En concordancia con lo anterior, este curso está propuesto desde un enfoque de aprendizaje orientado por proyectos, en el que los estudiantes sitúan un contexto de intervención en el cual diseñan e implementan una propuesta de evaluación, lo cual les permite desarrollar las competencias propuestas.","version":1}]}]}},"prerequisites":"PRÁCTICA FORMATIVA 1.","corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"VIERNES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":10,"name":"Gary Alberto Cifuentes Alvarez","rank":"Profesor Asociado"}]},{"id":75,"title":"CLIMA DE AULA Y COMPETENCIAS SOCIOEMOCIONALES","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2104","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"El aula es un espacio dinámico en el que, además de las actividades específicas de enseñanza académica, ocurre una multiplicidad de interacciones igualmente formativas. Los profesores, como líderes de buena parte de las experiencias que suceden en el aula, tienen el reto de manejar (gestionar) el aula para garantizar que los estudiantes aprovechen al máximo las oportunidades de aprendizaje que sus maestros les ofrecen. Aproximaciones recientes amplían la visión tradicional del manejo de aula para considerarlo como las acciones que los docentes realizan para crear un ambiente que apoye y facilite tanto el aprendizaje académico como el social, emocional y moral. En otras palabras, el manejo de aula no sólo busca establecer y mantener un ambiente ordenado y eficiente para que los estudiantes se involucren en un aprendizaje académico significativo, sino que también busca promover el crecimiento social y moral de los estudiantes. En este curso abordaremos el manejo de aula desde esta perspectiva, desarrollando en sus participantes competencias docentes que les permitan construir un clima de aula propicio para la formación de ciudadanos democráticos: participativos, activos, críticos, autónomos y cuidadosos.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MIÉRCOLES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":15,"name":"Ana Maria Velasquez Niño","rank":"Profesora Titular"}]},{"id":74,"title":"PRÁCTICA FORMATIVA 1","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2201","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"La práctica formativa I, en particular, está orientada al desarrollo de la capacidad de los estudiantes ser observadores sistemáticos, rigurosos y responsables del ambiente social, emocional y de aprendizaje del aula, a través del modelo CLASS (Classroom Assesment Scoring System). Esto les permite a los estudiantes matizar su observación, su juicio y su concepto con los lentes de un profesional crítico, orientado por la búsqueda la excelencia de su profesión y de la construcción una cultura de la ética del cuidado en el aula.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":"TEORÍAS Y RETOS DEL APRENDIZAJE","corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":13,"name":"Nataly Obando Rozo","rank":"Profesora Asistente"}]},{"id":73,"title":"PRÁCTICA FORMATIVA 2","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2202","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"La práctica formativa II está orientada a analizar los retos de enseñanza y aprendizaje en el aula en función de la fundamentación pedagógica propuesta por la institución educativa. Para el logro de los objetivos propuestos los practicantes realizarán ejercicios de reflexión de la práctica pedagógica del Maestro Mentor y la propia.Los aprendizajes y las experiencias adquiridos en las prácticas formativas I también les permitirá a los practicantes hacer comparaciones sobre las dinámicas de aula en contextos educativos distintos. Los practicantes realizarán un ejercicio de indagación, sobre el componente pedagógico de la institución, sus herramientas de planeación de clases, las del maestro mentor y los productos de aprendizaje de los estudiantes. Todos los practicantes deben trabajar en la dimensión de retos del aprendizaje y enseñanza en el aula y realizar mínimo 4 intervenciones pedagógicas asignadas y acompañadas por el Maestro Mentor tanto en la planeación como en la implementación.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":"PRÁCTICA FORMATIVA 1. CUMPLIR CON EL 50% DE LOS CURSOS DISCIPLINARES.","corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":9,"name":"Mariana Tafur Arciniegas","rank":"Profesora Asociada"}]},{"id":72,"title":"PRÁCTICA FORMATIVA 3","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2203","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"La práctica formativa III está orientada a que los estudiantes analicen la importancia de articular el direccionamiento estratégico y los procesos de enseñanza y aprendizaje de las instituciones educativas con los referentes (estándares, fines de la educación, objetivos) nacionales e internacionales utilizando información de fuentes primarias y secundarias.Para ello, durante este semestre centramos la reflexión en determinar los puntos de encuentro entre el direccionamiento estratégico y los procesos de enseñanza y aprendizaje de las instituciones de práctica con los fines de la educación, los objetivos por nivel, los lineamientos y estándares publicados por el MEN a nivel nacional; los objetivos educativos del milenio y los propósitos de formación para una ciudadanía global UNESCO a nivel internacional.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":"PRÁCTICA FORMATIVA 2.","corequisites":null,"observations":"Solo para estudiantes que cursan cuarto semestre en adelante.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":16,"name":"Hans Walter Cabra Hernandez","rank":"Profesor Asistente"}]},{"id":71,"title":"EDUCACIÓN MATEMÁTICA 1","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-2205","credits":2,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":null,"corequisites":null,"observations":"Solo para estudiantes de la Licenciatura en Matemáticas.","active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"5:00 PM","endTime":"7:50 PM"}],"professors":[{"id":8,"name":"Pedro Gómez","rank":"Profesor Visitante"}]},{"id":70,"title":"RETOS. PEDAGO.DISCI. 1","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3103","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Durante este curso estaremos reflexionando acerca de la importancia de desarrollar la comprensión en nuestras aulas, hacerlas visibles y así llevar a nuestros estudiantes a alcanzar verdaderas comprensiones que les permitan utilizar los conocimientos de manera creativa y flexible para enfrentar los desafíos del mundo de hoy. Esto lo haremos teniendo como centro la creación de un proyecto de diseño de una intervención en el aula a partir de un reto identificado , si es posible la implementaremos y reflexionaremos sobre los resultados.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":null,"corequisites":"Práctica Profesional 1","observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":7,"name":"Nancy Palacios Mena","rank":"Profesora Asociada"}]},{"id":69,"title":"RETOS. PEDAGO.DISCI. 2","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3104","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Durante este curso estaremos reflexionando acerca de la importancia de desarrollar la comprensión en nuestras aulas, hacerlas visibles y así llevar a nuestros estudiantes a alcanzar verdaderas comprensiones que les permitan utilizar los conocimientos de manera creativa y flexible para enfrentar los desafíos del mundo de hoy. Esto lo haremos teniendo como centro el trabajo de grado donde a partir de un reto identificado, se diseñará una secuencia didáctica, la cual se implementará y evaluará.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":null,"corequisites":"Práctica Profesional 2","observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MIÉRCOLES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":6,"name":"Juan Eduardo Escallon Largacha","rank":"Profesor Asociado"}]},{"id":68,"title":"PRÁCTICA.PROFESIONAL 1","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3105","credits":10,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"La práctica profesional está orientada hacia el análisis e integración de la multiplicidad de dimensiones del mundo escolar y de la intervención pedagógica: los retos de aprendizaje y enseñanza en el aula, los espacios y recursos para el aprendizaje, escuela y familia, la escuela y su contexto, la cultura institucional, el clima escolar, la responsabilidad ética del docente y el sentido social de la educación. Además del trabajo de intervención pedagógica, durante la práctica profesional se desarrolla un ejercicio de investigación acción en el aula, que tiene como producto el trabajo de grado del programa de Licenciatura.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":"PRÁCTICA FORMATIVA 3, CLIMA DE AULA, EVALUACIÓN DEL APRENDIZAJE Y DISEÑO CURRICULAR. CUMPLIR CON EL 80% DE LOS CURSOS DISCIPLINARES. INGLÉS 06 APROBADO.","corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"LUNES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":15,"name":"Ana Maria Velasquez Niño","rank":"Profesora Titular"}]},{"id":67,"title":"PRÁCTICA.PROFESIONAL 2","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3106","credits":10,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"La práctica profesional está orientada hacia el análisis e integración de la multiplicidad de dimensiones del mundo escolar y de la intervención pedagógica: los retos de aprendizaje y enseñanza en el aula, los espacios y recursos para el aprendizaje, escuela y familia, la escuela y su contexto, la cultura institucional, el clima escolar, la responsabilidad ética del docente y el sentido social de la educación. Además del trabajo de intervención pedagógica, durante la práctica profesional se desarrolla un ejercicio de investigación acción en el aula, que tiene como producto el trabajo de grado del programa de Licenciatura.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":"PRÁCTICA.PROFESIONAL 1. CUMPLIR CON EL 100% DE LOS CURSOS DISCIPLINARES.","corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"LUNES","startTime":"2:00 PM","endTime":"4:50 PM"}],"professors":[{"id":11,"name":"Carolina Maldonado Carreño","rank":"Profesora Titular"}]},{"id":66,"title":"EL SENTIDO DE LA EDUCACIÓN","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3107","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"El curso El Sentido de la Educación permite a los estudiantes analizar críticamente y asumir una postura sobre el sentido ético y político de la educación en conexión con su profesión docente. Este curso aporta al propósito de formación socio humanística y científica de la Universidad de los Andes desde un enfoque crítico e integrador. Bajo este marco, el diseño pedagógico y didáctico del curso está orientado a que los y las estudiantes se sensibilicen y amplíen su comprensión sobre la educación, especialmente sobre las problemáticas, las tensiones y los retos que trae consigo para el país y su crecimiento profesional. Concretamente, el laboratorio de este curso tiene como propósito desarrollar una aproximación sistemática a los principios, trabajos y diversas experiencias que permiten pensar el sentido de la educación que se está produciendo en el país, mediante la observación, registro, codificación y análisis de ambientes de aprendizaje, prácticas pedagógicas y procesos del desarrollo humano que se llevan a cabo en diversas regiones e instituciones educativas.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"JUEVES","startTime":"8:00 AM","endTime":"11:50 AM"}],"professors":[{"id":12,"name":"Jose Dario Herrera Gonzalez","rank":"Profesor Asociado"}]},{"id":65,"title":"LA EDUCACIÓN EN COLOMBIA","titleLine2":null,"category":"pregrado","programType":"LIC","subProgram":null,"code":"EDUC-3108","credits":3,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"Que la educación sea un componente clave para el desarrollo de los individuos y las naciones es el resultado de un proceso histórico de luchas por adquirir un derecho que no siempre se consideró como tal. En este curso analizamos, desde la perspectiva del derecho a la educación, cómo se ha configurado, pero también abrimos una discusión sobre algunas de las principales controversias que son la base para estructurar la política pública contemporánea. Por medio de debates grupales y un proyecto de indagación individual, los estudiantes en este curso podrán introducirse al campo de la educación en Colombia y desarrollar una lectura crítica, reflexiva y ligada a su propia trayectoria educativa.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"MARTES","startTime":"8:00 AM","endTime":"11:50 AM"}],"professors":[{"id":7,"name":"Nancy Palacios Mena","rank":"Profesora Asociada"}]},{"id":64,"title":"CURRICULO Y PEDAGOGIA","titleLine2":null,"category":"posgrado","programType":"MS","subProgram":"compartido","code":"EDUC-4017","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"type":"root","format":"","indent":0,"version":1,"direction":"ltr","children":[{"type":"paragraph","format":"","indent":0,"version":1,"direction":"ltr","textFormat":0,"children":[{"type":"text","detail":0,"format":0,"mode":"normal","style":"","text":"En muchas ocasiones, el concepto de currículo se asocia al diseño de estándares educativos y a planes de estudios que se imponen desde la política pública. Esto ha generado unas tensiones permanentes entre los profesores y esa noción tradicional del currículo. En este curso se analizan de manera crítica y propositiva diferentes perspectivas curriculares y la manera cómo éstas permiten redefinir el concepto de currículo, para invitar a los participantes a repensar tanto los fines de la educación como las prácticas pedagógicas. A partir de esto, el curso busca que los participantes reflexionen acerca de y reconstruyan sus propios conceptos y perspectivas sobre el currículo y la pedagogía; generen un compromiso con su rol personal como agente constructor de currículo; evalúen currículos de manera crítica y sustentada; y propongan acciones de transformación de sus propios currículos.","version":1}]}]}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"SÁBADO","startTime":"10:00 AM","endTime":"12:50 PM"}],"professors":[]},{"id":63,"title":"MÉTODOS CUALITATIVOS DE INVESTIGACIÓN","titleLine2":null,"category":"posgrado","programType":"MS","subProgram":"investigacion","code":"EDUC-4027","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"El propósito de este curso es introducir al estudiante a los diseños y métodos de investigación cualitativa en educación. Discutiremos las características generales de la investigación cualitativa y exploraremos diferentes métodos de investigación, tales como estudios de caso, etnografía, investigación acción, y veremos estrategias de recolección de información concretas como entrevistas, grupos focales, observaciones, análisis de documentos, entre otros. Exploraremos diferentes alternativas para analizar la información recolectada para un estudio de investigación cualitativa. Para ello, conoceremos las perspectivas y formas de hacer análisis cualitativa, veremos diferentes maneras de codificar datos cualitativos, como visualizar y organizar datos cualitativos, como generar interpretaciones y conclusiones con rigor y calidad, y finalmente como preparar y presentar los resultados de una investigación.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"SÁBADO","startTime":"10:00 AM","endTime":"12:50 PM"}],"professors":[]},{"id":62,"title":"INVESTIGACIÓN EN EDUCACIÓN POSGRADOS","titleLine2":null,"category":"posgrado","programType":"MS","subProgram":"investigacion","code":"EDUC-4047","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Brindar una panorámica histórica y filosófica de la configuración de la investigación educativa en relación con la práctica pedagógica. Dar a conocer los elementos y pasos o etapas más importantes de la práctica de la investigación para el mejoramiento de la educación y la pedagogía.Establecer las diferencias y características de los métodos cualitativos, cuantitativos y mixtos para le investigación en educación y pedagogía. Problematizar el alcance, las posibilidades y limitaciones de la investigación para el mejoramiento y la transformación de la práctica pedagógica.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}},"prerequisites":null,"corequisites":null,"observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[{"day":"LUNES","startTime":"5:00 PM","endTime":"7:50 PM"}],"professors":[]},{"id":61,"title":"GESTIÓN Y LIDERAZGO DEL CAMBIO EDUCATIVO","titleLine2":null,"category":"posgrado","programType":"MS","subProgram":"compartido","code":"EDUC-4062","credits":4,"weeks":16,"modality":"PRESENCIAL","description":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Este curso explora las teorías y prácticas contemporáneas en liderazgo educativo, con un enfoque en su aplicación en los contextos colombiano y latinoamericano. Los participantes explorarán diversas teorías de liderazgo en el ámbito educativo, tales como el liderazgo transformacional, liderazgo distribuido, liderazgo pedagógico, entre otras. A lo largo del programa, tendrán la oportunidad de examinar y desarrollar estrategias y prácticas clave para la gestión del cambio institucional, incluyendo:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Comprensión del contexto como elemento clave del cambio.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Construcción de una visión y metas colectivas","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Desarrollo profesional docente y fomento del liderazgo distribuido.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Diseño y gestión de proyectos de inclusión, equidad y mejora de la calidad educativa.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Fomento de una cultura colaborativa y de confianza relacional con docentes, familias y otros grupos de interés.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Comunicación para el cambio.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Evaluación del desempeño.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":7}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"El curso combina estudios de caso, ejercicios prácticos y trabajo colaborativo para asegurar que los participantes puedan aplicar lo aprendido directamente en sus contextos institucionales.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr", LÉS PARA GRADUARSE.","corequisites":"Inglés para Doctorado 3","observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[]},{"id":2,"title":"SUSTENTACIÓN DE TESIS DOCTORAL","titleLine2":null,"category":"posgrado","programType":"DOC","subProgram":null,"code":"EDUC-6990","credits":0,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":"IMPORTANTE APROBAR ESTE NIVEL DE INGLÉS PARA GRADUARSE.","corequisites":"Inglés para Doctorado 3","observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[]},{"id":1,"title":"SUSTENTACIÓN DE TESIS DOCTORAL","titleLine2":null,"category":"posgrado","programType":"DOC","subProgram":null,"code":"EDUC-6990","credits":0,"weeks":16,"modality":"PRESENCIAL","description":null,"prerequisites":"IMPORTANTE APROBAR ESTE NIVEL DE INGLÉS PARA GRADUARSE.","corequisites":"Inglés para Doctorado 3","observations":null,"active":true,"obligatoriaEn":[],"electivaEn":[],"scheduleSlots":[],"professors":[]}],"professors":[{"id":15,"name":"Ana Maria Velasquez Niño","rank":"Profesora Titular","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Profesora Titular y codirectora del grupo de investigación Educación para la primera infancia. Es Psicóloga de la Universidad de los Andes, obtuvo su doctorado en la Escuela de Educación de la Universidad de Pittsburgh (EE.UU.) y tiene una Maestría en Psicología y Educación y una especialización en Estudios Latinoamericanos de la misma institución.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Su área de experticia está en la Educación Inicial. Tiene una larga experiencia documentando la calidad de las interacciones y es reconocida por su liderazgo en los procesos de evaluación y medición de la calidad de la educación inicial y el desarrollo infantil en Colombia y América Latina. Dirigió la medición nacional de la calidad de la educación inicial de Colombia y ha codirigido las evaluaciones de los programas de desarrollo profesional de aeioTU.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"A través de sus publicaciones y de proyectos financiados por entidades externas a la Universidad, ha contribuido al mejoramiento de la educación inicial en el país y al debate sobre la medición de la calidad de la educación inicial en la región. En la Universidad de los Andes se ha desempeñado como Vicedecana de la Facultad de Educación, Directora Académica de la Facultad de Ciencias Sociales y Directora de posgrados de Psicología.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":2,"name":"Andrea Del Pilar Solano Vargas","rank":"Profesora Asociada","bio":null},{"id":11,"name":"Carolina Maldonado Carreño","rank":"Profesora Titular","bio":null},{"id":1,"name":"Edwin Giovanni Ussa Valderrama","rank":"Profesor de Cátedra","bio":null},{"id":10,"name":"Gary Alberto Cifuentes Alvarez","rank":"Profesor Asociado","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Profesor asociado e investigador de la Facultad de Educación (Universidad de los Andes, Colombia) en la que ha trabajado por más de veinte (20) años. Es Doctor en Human Centered Communication and Informatics de la Universidad de Aalborg (Dinamarca).","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Dentro de sus libros más recientes se encuentran Lineamientos para investigar y evaluar innovaciones educativas (2018); Características individuales e institucionales que promueven la investigación y la innovación educativa en el Distrito Capital (2020); y Transformaciones que perduran: Orientaciones para garantizar la sostenibilidad de una innovación educativa (2024).","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Sus intereses académicos y de docencia giran alrededor de la innovación educativa y su liderazgo, la evaluación de los aprendizajes y la dimensión política de la innovación educativa. Fundamentado desde enfoques cualitativos y mixtos, especialmente desde enfoques como el policy enactment, los casos de estudios y la teoría de actor-red, su agenda examina la interconexión entre tecnologías, políticas y educación desde una perspectiva crítica.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":16,"name":"Hans Walter Cabra Hernandez","rank":"Profesor Asistente","bio":null},{"id":17,"name":"Jorge Andres Mejia Delgadillo","rank":"Profesor Asociado","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Líneas de investigación: Filosofía de la educación, ciudadanía, pedagogías críticas, formación ciudadana y ética, pensamiento crítico en educación.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":5,"name":"Jorge Grant Baxter","rank":"Profesor Asociado","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Áreas de interés: Educación, Análisis de políticas públicas en educación, Gobernabilidad y reformas educativas, Participación social en educación, Cooperación internacional en educación, Educación y desarrollo, Educación y democracia, Comunicación y salud, Cine y educación.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":12,"name":"Jose Dario Herrera Gonzalez","rank":"Profesor Asociado","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Doctor en Filosofía de la Universidad Nacional de Colombia. Ha sido autor, entre otros, de Comanche, comandante del Cartucho (Premio Nacional de Historias de Vida); La comprensión de lo social; Pensar la educación, hacer investigación, y de más de una treintena de artículos en el campo de la educación y las ciencias sociales. Sus áreas de investigación son la hermenéutica, la pedagogía y las ciencias sociales.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0}],"direction":"ltr","format":"","indent":0,"version":1}}},{"id":6,"name":"Juan Eduardo Escallon Largacha","rank":"Profesor Asociado","bio":{"root":{"type":"root","children":[{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Eduardo Escallón es Profesor Asociado y codirector del grupo de investigación Educación para la primera infancia. Historiador y doctor en Literaturas y Lenguas Romances. Fundó y dirigió el Centro de Español de la Universidad de los Andes, dirigió el Centro de Investigación y Formación en Educación – CIFE – y lideró la creación de la Facultad de Educación.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph","version":1,"children":[{"type":"text","version":1,"text":"Como primer Decano dirigió la creación y puesta en marcha de las nueve Licenciaturas que ofrece la Facultad, de la Escuela de Posgrados, y del Centro de Evaluación y se enfocó en dignificar la profesión docente en Colombia. Es autor de varios artículos académicos relacionados con currículo y pedagogía y como escritor ha publicado varias obras.","format":0,"style":""}],"direction":"ltr","format":"","indent":0,"textFormat":0},{"type":"paragraph",
